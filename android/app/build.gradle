apply plugin: "com.android.application"
apply plugin: "com.facebook.react"

android {
    namespace "com.fashionworldapp"
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.fashionworldapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"

        // Optional for Hermes
        // if you're using Hermes, enable this:
        // ndk {
        //     abiFilters "armeabi-v7a", "x86", "arm64-v8a", "x86_64"
        // }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // Core React Native runtime
    implementation "com.facebook.react:react-android:0.78.2"

    // SwipeRefreshLayout
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.0.0"

    // Fresco image library (required by RN)
    implementation "com.facebook.fresco:fresco:2.5.0"

    // Optional - If you're using Hermes
    // implementation("com.facebook.react:hermes-android:0.78.2")

    // Add other dependencies as needed
}
